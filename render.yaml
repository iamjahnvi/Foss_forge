# Render Blueprint: https://render.com/docs/blueprint-spec
# Collections are kept in each visitor's browser, so the service is stateless
# and needs no disk.
services:
  - type: web
    name: kiwix-collections
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
